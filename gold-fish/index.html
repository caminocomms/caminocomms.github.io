<!DOCTYPE html>
<html>
<head>
	<title>Goldfish</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
	<style type="text/css">
		body {
			background-color: black;
		}

		#pacman {
			height: 700px;
			width: 580px;
			border-radius: 5px;
			margin: 0 auto 20px;
			position: relative;
		}

		#pacman canvas {
			position: relative;
			z-index: 1;
			display: block;
		}

		#shim {
			font-family: 'Poppins', sans-serif;
			position: absolute;
			visibility: hidden
		}

		h1 {
			font-family: 'Poppins', sans-serif;
			text-align: center;
			color: yellow;
		}

		body {
			width: 580px;
			margin: 0px auto;
			font-family: 'Poppins', sans-serif;
		}

		#hud {
			width: 580px;
			margin: 56px auto 0;
			display: flex;
			justify-content: space-between;
			align-items: flex-end;
			padding: 0 18px 0 14px;
			box-sizing: border-box;
		}

		#hud-brand {
			display: flex;
			align-items: center;
		}

		#score-chip {
			padding: 10px 14px;
			border-radius: 14px;
			background: rgba(17, 24, 39, 0.92);
			border: 2px solid #1d4ed8;
			color: white;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
			min-width: 118px;
		}

		#score-chip .label {
			display: block;
			font-size: 11px;
			font-weight: 500;
			color: #cbd5e1;
			line-height: 1.1;
		}

		#score-chip .value {
			display: block;
			margin-top: 4px;
			font-size: 16px;
			font-weight: 700;
			line-height: 1.1;
		}

		#corner-logo {
			width: 42px;
			height: 42px;
			pointer-events: none;
			display: block;
		}

		#start-overlay {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			pointer-events: auto;
			z-index: 2;
		}

		#start-card {
			width: 74%;
			padding: 22px 18px;
			border-radius: 18px;
			background: rgba(0, 0, 0, 0.72);
			border: 2px solid #1d4ed8;
			box-sizing: border-box;
			text-align: center;
			pointer-events: auto;
			cursor: pointer;
			font: inherit;
			outline: none;
		}

		#start-card .title {
			display: block;
			color: #ffffff;
			font-size: 24px;
			font-weight: 700;
			line-height: 1.1;
		}

		#start-card .action {
			display: block;
			margin-top: 14px;
			color: #facc15;
			font-size: 14px;
			font-weight: 600;
			line-height: 1.1;
		}

		#start-card .hint {
			display: block;
			margin-top: 14px;
			color: #cbd5e1;
			font-size: 12px;
			font-weight: 500;
			line-height: 1.1;
		}

		p {
			text-decoration: none;
			color: #0000FF;
		}
	</style>
</head>
<body>
	<div id="shim">shim for font face</div>
	<div id="hud">
		<div id="hud-brand">
			<img id="corner-logo" src="camino-icon-small.svg" alt="">
		</div>
		<div id="score-chip">
			<span class="label">Score</span>
			<span class="value" id="score-value">0</span>
		</div>
	</div>
	<div id="pacman">
		<div id="start-overlay">
			<button id="start-card" type="button" aria-label="Start Goldfish" onclick="PACMAN.start(); return false;">
				<span class="title">Project Goldfish</span>
				<span class="action">Press Space To Start</span>
				<span class="hint">Move with Arrow Keys or WASD</span>
			</button>
		</div>
	</div>

	<script type="text/javascript">
		/*jslint browser: true, undef: true, eqeqeq: true, nomen: true, white: true */
/*global window: false, document: false */

/*
 * fix looped audio
 * add fruits + levels
 * fix what happens when a ghost is eaten (should go back to base)
 * do proper ghost mechanics (blinky/wimpy etc)
 */

var NONE        = 4,
    UP          = 3,
    LEFT        = 2,
    DOWN        = 1,
    RIGHT       = 11,
    WAITING     = 5,
    PAUSE       = 6,
    PLAYING     = 7,
    COUNTDOWN   = 8,
    EATEN_PAUSE = 9,
    DYING       = 10,
    Pacman      = {};

Pacman.FPS = 30;

var scoreValueEl = document.getElementById("score-value");
var startOverlayEl = document.getElementById("start-overlay");
var startCardEl = document.getElementById("start-card");

var fishSprite = new Image(),
    fishOpenSprite = new Image(),
    fishSpriteLoaded = false,
    fishOpenSpriteLoaded = false,
    fishOpenSpriteProcessed = null,
    fishSpriteReadyCallback = null;

fishSprite.onload = function () {
    fishSpriteLoaded = true;
    if (typeof fishSpriteReadyCallback === "function") {
        fishSpriteReadyCallback();
    }
};

fishSprite.onerror = function () {
    fishSpriteLoaded = false;
    if (typeof fishSpriteReadyCallback === "function") {
        fishSpriteReadyCallback();
    }
};

fishOpenSprite.onload = function () {
    fishOpenSpriteLoaded = true;
    fishOpenSpriteProcessed = document.createElement("canvas");
    fishOpenSpriteProcessed.width = fishOpenSprite.width;
    fishOpenSpriteProcessed.height = fishOpenSprite.height;

    var openCtx = fishOpenSpriteProcessed.getContext("2d"),
        imageData = null,
        data = null,
        i = 0;

    openCtx.drawImage(fishOpenSprite, 0, 0);
    imageData = openCtx.getImageData(0, 0, fishOpenSprite.width, fishOpenSprite.height);
    data = imageData.data;

    // Remove the solid black export background and bright white edge pixels.
    for (i = 0; i < data.length; i += 4) {
        if (data[i] < 18 && data[i + 1] < 18 && data[i + 2] < 18) {
            data[i + 3] = 0;
        } else if (data[i] > 240 && data[i + 1] > 240 && data[i + 2] > 240) {
            data[i + 3] = 0;
        }
    }

    openCtx.putImageData(imageData, 0, 0);

    if (typeof fishSpriteReadyCallback === "function") {
        fishSpriteReadyCallback();
    }
};

fishOpenSprite.onerror = function () {
    fishOpenSpriteLoaded = false;
};

fishSprite.src = "goldfish-transparent.png";
fishOpenSprite.src = "goldfish-open.png";

Pacman.Ghost = function (game, map, colour) {

    var position  = null,
        direction = null,
        eatable   = null,
        eaten     = null,
        due       = null;
    
    function getNewCoord(dir, current) { 
        
        var speed  = isVunerable() ? 0.5 : isHidden() ? 2 : 1,
            xSpeed = (dir === LEFT && -speed || dir === RIGHT && speed || 0),
            ySpeed = (dir === DOWN && speed || dir === UP && -speed || 0);
    
        return {
            "x": addBounded(current.x, xSpeed),
            "y": addBounded(current.y, ySpeed)
        };
    };

    /* Collision detection(walls) is done when a ghost lands on an
     * exact block, make sure they dont skip over it 
     */
    function addBounded(x1, x2) { 
        var rem    = x1 % 10, 
            result = rem + x2;
        if (rem !== 0 && result > 10) {
            return x1 + (10 - rem);
        } else if(rem > 0 && result < 0) { 
            return x1 - rem;
        }
        return x1 + x2;
    };
    
    function isVunerable() { 
        return eatable !== null;
    };
    
    function isDangerous() {
        return eaten === null;
    };

    function isHidden() { 
        return eatable === null && eaten !== null;
    };
    
    function getRandomDirection() {
        var moves = (direction === LEFT || direction === RIGHT) 
            ? [UP, DOWN] : [LEFT, RIGHT];
        return moves[Math.floor(Math.random() * 2)];
    };

    function getAvailableDirections(pos) {
        var options = [],
            square = {
                "y": pointToCoord(pos.y),
                "x": pointToCoord(pos.x)
            };

        if (map.isFloorSpace({"y": square.y, "x": square.x - 1})) {
            options.push(LEFT);
        }
        if (map.isFloorSpace({"y": square.y, "x": square.x + 1})) {
            options.push(RIGHT);
        }
        if (map.isFloorSpace({"y": square.y - 1, "x": square.x})) {
            options.push(UP);
        }
        if (map.isFloorSpace({"y": square.y + 1, "x": square.x})) {
            options.push(DOWN);
        }

        return options;
    };
    
    function reset() {
        eaten = null;
        eatable = null;
        position = {"x": 90, "y": 100};
        direction = getRandomDirection();
        due = getRandomDirection();
    };
    
    function onWholeSquare(x) {
        return x % 10 === 0;
    };
    
    function oppositeDirection(dir) { 
        return dir === LEFT && RIGHT ||
            dir === RIGHT && LEFT ||
            dir === UP && DOWN || UP;
    };

    function makeEatable() {
        direction = oppositeDirection(direction);
        eatable = game.getTick();
    };

    function eat() { 
        eatable = null;
        eaten = game.getTick();
    };

    function pointToCoord(x) {
        return Math.round(x / 10);
    };

    function nextSquare(x, dir) {
        var rem = x % 10;
        if (rem === 0) { 
            return x; 
        } else if (dir === RIGHT || dir === DOWN) { 
            return x + (10 - rem);
        } else {
            return x - rem;
        }
    };

    function onGridSquare(pos) {
        return onWholeSquare(pos.y) && onWholeSquare(pos.x);
    };

    function secondsAgo(tick) { 
        return (game.getTick() - tick) / Pacman.FPS;
    };

    function getColour() { 
        if (eatable) { 
            if (secondsAgo(eatable) > 5) { 
                return game.getTick() % 20 > 10 ? "#FFFFFF" : "#0000BB";
            } else { 
                return "#0000BB";
            }
        } else if(eaten) { 
            return "#222";
        } 
        return colour;
    };

    function draw(ctx) {
  
        var s    = map.blockSize, 
            top  = (position.y/10) * s,
            left = (position.x/10) * s;
    
        if (eatable && secondsAgo(eatable) > 8) {
            eatable = null;
        }
        
        if (eaten && secondsAgo(eaten) > 3) { 
            eaten = null;
        }
        
        var tl = left + s;
        var base = top + s - 3;
        var inc = s / 10;

        var high = game.getTick() % 10 > 5 ? 3  : -3;
        var low  = game.getTick() % 10 > 5 ? -3 : 3;

        ctx.fillStyle = getColour();
        ctx.beginPath();

        ctx.moveTo(left, base);

        ctx.quadraticCurveTo(left, top, left + (s/2),  top);
        ctx.quadraticCurveTo(left + s, top, left+s,  base);
        
        // Wavy things at the bottom
        ctx.quadraticCurveTo(tl-(inc*1), base+high, tl - (inc * 2),  base);
        ctx.quadraticCurveTo(tl-(inc*3), base+low, tl - (inc * 4),  base);
        ctx.quadraticCurveTo(tl-(inc*5), base+high, tl - (inc * 6),  base);
        ctx.quadraticCurveTo(tl-(inc*7), base+low, tl - (inc * 8),  base); 
        ctx.quadraticCurveTo(tl-(inc*9), base+high, tl - (inc * 10), base); 

        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = "#FFF";
        ctx.arc(left + 6,top + 6, s / 6, 0, 300, false);
        ctx.arc((left + s) - 6,top + 6, s / 6, 0, 300, false);
        ctx.closePath();
        ctx.fill();

        var f = s / 12;
        var off = {};
        off[RIGHT] = [f, 0];
        off[LEFT]  = [-f, 0];
        off[UP]    = [0, -f];
        off[DOWN]  = [0, f];

        ctx.beginPath();
        ctx.fillStyle = "#000";
        ctx.arc(left+6+off[direction][0], top+6+off[direction][1], 
                s / 15, 0, 300, false);
        ctx.arc((left+s)-6+off[direction][0], top+6+off[direction][1], 
                s / 15, 0, 300, false);
        ctx.closePath();
        ctx.fill();

    };

    function pane(pos) {

        if (pos.y === 100 && pos.x >= 190 && direction === RIGHT) {
            return {"y": 100, "x": -10};
        }
        
        if (pos.y === 100 && pos.x <= -10 && direction === LEFT) {
            return position = {"y": 100, "x": 190};
        }

        return false;
    };
    
    function move(ctx) {
        
        var oldPos = position,
            onGrid = onGridSquare(position),
            npos   = null,
            options = null;
        
        if (due !== direction) {
            
            npos = getNewCoord(due, position);
            
            if (onGrid &&
                map.isFloorSpace({
                    "y":pointToCoord(nextSquare(npos.y, due)),
                    "x":pointToCoord(nextSquare(npos.x, due))})) {
                direction = due;
            } else {
                npos = null;
            }
        }
        
        if (npos === null) {
            npos = getNewCoord(direction, position);
        }
        
        if (onGrid &&
            map.isWallSpace({
                "y" : pointToCoord(nextSquare(npos.y, direction)),
                "x" : pointToCoord(nextSquare(npos.x, direction))
            })) {

            options = getAvailableDirections(position);

            if (options.length === 0) {
                return {
                    "new" : position,
                    "old" : oldPos
                };
            }

            direction = options[Math.floor(Math.random() * options.length)];
            due = direction;
            npos = getNewCoord(direction, position);
        }

        position = npos;        
        
        var tmp = pane(position);
        if (tmp) { 
            position = tmp;
        }
        
        due = getRandomDirection();
        
        return {
            "new" : position,
            "old" : oldPos
        };
    };
    
    return {
        "eat"         : eat,
        "isVunerable" : isVunerable,
        "isDangerous" : isDangerous,
        "makeEatable" : makeEatable,
        "reset"       : reset,
        "move"        : move,
        "draw"        : draw
    };
};

Pacman.User = function (game, map) {
    
    var position  = null,
        lastPosition = null,
        direction = null,
        eaten     = null,
        due       = null, 
        lives     = null,
        score     = 5,
        keyMap    = {};
    
    keyMap[KEY.ARROW_LEFT]  = LEFT;
    keyMap[KEY.ARROW_UP]    = UP;
    keyMap[KEY.ARROW_RIGHT] = RIGHT;
    keyMap[KEY.ARROW_DOWN]  = DOWN;
    keyMap[KEY.A]           = LEFT;
    keyMap[KEY.W]           = UP;
    keyMap[KEY.D]           = RIGHT;
    keyMap[KEY.S]           = DOWN;

    function addScore(nScore) { 
        score += nScore;
        if (score >= 10000 && score - nScore < 10000) { 
            lives += 1;
        }
    };

    function theScore() { 
        return score;
    };

    function loseLife() { 
        lives -= 1;
    };

    function getLives() {
        return lives;
    };

    function initUser() {
        score = 0;
        lives = 3;
        newLevel();
    }
    
    function newLevel() {
        resetPosition();
        eaten = 0;
    };
    
    function resetPosition() {
        position = {"x": 90, "y": 160};
        lastPosition = {"x": 90, "y": 160};
        direction = LEFT;
        due = LEFT;
    };
    
    function reset() {
        initUser();
        resetPosition();
    };        
    
    function keyDown(e) {
        if (typeof keyMap[e.keyCode] !== "undefined") { 
            due = keyMap[e.keyCode];
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        return true;
	};

    function getNewCoord(dir, current) {   
        return {
            "x": current.x + (dir === LEFT && -1 || dir === RIGHT && 1 || 0),
            "y": current.y + (dir === DOWN && 1 || dir === UP    && -1 || 0)
        };
    };

    function onWholeSquare(x) {
        return x % 10 === 0;
    };

    function pointToCoord(x) {
        return Math.round(x/10);
    };
    
    function nextSquare(x, dir) {
        var rem = x % 10;
        if (rem === 0) { 
            return x; 
        } else if (dir === RIGHT || dir === DOWN) { 
            return x + (10 - rem);
        } else {
            return x - rem;
        }
    };

    function next(pos, dir) {
        return {
            "y" : pointToCoord(nextSquare(pos.y, dir)),
            "x" : pointToCoord(nextSquare(pos.x, dir)),
        };                               
    };

    function onGridSquare(pos) {
        return onWholeSquare(pos.y) && onWholeSquare(pos.x);
    };

    function isOnSamePlane(due, dir) { 
        return ((due === LEFT || due === RIGHT) && 
                (dir === LEFT || dir === RIGHT)) || 
            ((due === UP || due === DOWN) && 
             (dir === UP || dir === DOWN));
    };

    function move(ctx) {
        
        var npos        = null, 
            nextWhole   = null, 
            oldPosition = position,
            block       = null;
        
        if (due !== direction) {
            npos = getNewCoord(due, position);
            
            if (isOnSamePlane(due, direction) || 
                (onGridSquare(position) && 
                 map.isFloorSpace(next(npos, due)))) {
                direction = due;
            } else {
                npos = null;
            }
        }

        if (npos === null) {
            npos = getNewCoord(direction, position);
        }
        
        if (onGridSquare(position) && map.isWallSpace(next(npos, direction))) {
            direction = NONE;
        }

        if (direction === NONE) {
            return {"new" : position, "old" : position};
        }
        
        if (npos.y === 100 && npos.x >= 190 && direction === RIGHT) {
            npos = {"y": 100, "x": -10};
        }
        
        if (npos.y === 100 && npos.x <= -12 && direction === LEFT) {
            npos = {"y": 100, "x": 190};
        }
        
        lastPosition = {"x": position.x, "y": position.y};
        position = npos;        
        nextWhole = next(position, direction);
        
        block = map.block(nextWhole);        
        
        if ((isMidSquare(position.y) || isMidSquare(position.x)) &&
            block === Pacman.BISCUIT || block === Pacman.PILL) {
            
            map.setBlock(nextWhole, Pacman.EMPTY);           
            addScore((block === Pacman.BISCUIT) ? 10 : 50);
            eaten += 1;
            
            if (eaten === 182) {
                game.completedLevel();
            }
            
            if (block === Pacman.PILL) { 
                game.eatenPill();
            }
        }   
                
        return {
            "new" : position,
            "old" : oldPosition
        };
    };

    function isMidSquare(x) { 
        var rem = x % 10;
        return rem > 3 || rem < 7;
    };

    function calcAngle(dir, pos) { 
        if (dir == RIGHT && (pos.x % 10 < 5)) {
            return {"start":0.25, "end":1.75, "direction": false};
        } else if (dir === DOWN && (pos.y % 10 < 5)) { 
            return {"start":0.75, "end":2.25, "direction": false};
        } else if (dir === UP && (pos.y % 10 < 5)) { 
            return {"start":1.25, "end":1.75, "direction": true};
        } else if (dir === LEFT && (pos.x % 10 < 5)) {             
            return {"start":0.75, "end":1.25, "direction": true};
        }
        return {"start":0, "end":2, "direction": false};
    };

    function directionToAngle(dir) {
        if (dir === LEFT) {
            return 0;
        } else if (dir === UP) {
            return Math.PI / 2;
        } else if (dir === DOWN) {
            return -Math.PI / 2;
        } else if (dir === RIGHT) {
            return Math.PI;
        }
        return 0;
    };

    function drawPixelFish(ctx, x, y, size, dir) {
        var angle = directionToAngle(dir),
            spriteWidth = size * 3.5,
            spriteHeight = size * 3.5,
            sprite = fishSprite,
            frame = Math.floor(Date.now() / 140) % 2,
            isMoving = lastPosition &&
                (lastPosition.x !== position.x || lastPosition.y !== position.y);

        if (isMoving && fishOpenSpriteLoaded &&
                fishOpenSpriteProcessed && frame === 0) {
            sprite = fishOpenSpriteProcessed;
        }

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.imageSmoothingEnabled = false;

        if (fishSpriteLoaded) {
            ctx.drawImage(
                sprite,
                -spriteWidth / 2,
                -spriteHeight / 2,
                spriteWidth,
                spriteHeight
            );
        } else {
            ctx.fillStyle = "#f59e0b";
            ctx.beginPath();
            ctx.arc(-size * 0.05, 0, size * 0.55, 0, Math.PI * 2, false);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(size * 0.25, 0);
            ctx.lineTo(size * 0.85, -size * 0.45);
            ctx.lineTo(size * 0.85, size * 0.45);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#000000";
            ctx.fillRect(-size * 0.45, -size * 0.12, size * 0.14, size * 0.24);
        }

        if (isMoving && frame === 0) {
            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.moveTo(-spriteWidth * 0.42, -spriteHeight * 0.08);
            ctx.lineTo(-spriteWidth * 0.23, 0);
            ctx.lineTo(-spriteWidth * 0.42, spriteHeight * 0.08);
            ctx.closePath();
            ctx.fill();
        }

        ctx.restore();
    }

    function draw(ctx) { 

        var s = map.blockSize;
        drawPixelFish(
            ctx,
            ((position.x/10) * s) + s / 2,
            ((position.y/10) * s) + s / 2,
            s,
            direction
        );
    };
    
    initUser();

    return {
        "draw"          : draw,
        "loseLife"      : loseLife,
        "getLives"      : getLives,
        "score"         : score,
        "addScore"      : addScore,
        "theScore"      : theScore,
        "keyDown"       : keyDown,
        "move"          : move,
        "newLevel"      : newLevel,
        "reset"         : reset,
        "resetPosition" : resetPosition
    };
};

Pacman.Map = function (size) {
    
    var height    = null, 
        width     = null, 
        blockSize = size,
        pillSize  = 0,
        map       = null;
    
    function withinBounds(y, x) {
        return y >= 0 && y < height && x >= 0 && x < width;
    }
    
    function isWall(pos) {
        return withinBounds(pos.y, pos.x) && map[pos.y][pos.x] === Pacman.WALL;
    }
    
    function isFloorSpace(pos) {
        if (!withinBounds(pos.y, pos.x)) {
            return false;
        }
        var peice = map[pos.y][pos.x];
        return peice === Pacman.EMPTY || 
            peice === Pacman.BISCUIT ||
            peice === Pacman.PILL ||
            peice === Pacman.BLOCK;
    }
    
    function drawWall(ctx) {

        var i, j, p, line;
        
        ctx.strokeStyle = "#0000FF";
        ctx.lineWidth   = 10;
        ctx.lineCap     = "round";
        
        for (i = 0; i < Pacman.WALLS.length; i += 1) {
            line = Pacman.WALLS[i];
            ctx.beginPath();

            for (j = 0; j < line.length; j += 1) {

                p = line[j];
                
                if (p.move) {
                    ctx.moveTo(p.move[0] * blockSize, p.move[1] * blockSize);
                } else if (p.line) {
                    ctx.lineTo(p.line[0] * blockSize, p.line[1] * blockSize);
                } else if (p.curve) {
                    ctx.quadraticCurveTo(p.curve[0] * blockSize, 
                                         p.curve[1] * blockSize,
                                         p.curve[2] * blockSize, 
                                         p.curve[3] * blockSize);

            ctx.stroke();

        width  = map[0].length;

        return map[pos.y][pos.x];
    };

        map[pos.y][pos.x] = type;
    };

        var pulse = (pillSize % 20) / 20;

        if (++pillSize > 30) {
            pillSize = 0;
        }
        
        for (i = 0; i < height; i += 1) {
		    for (j = 0; j < width; j += 1) {
                if (map[i][j] === Pacman.PILL) {
                    var scale = 1 + (pulse * 0.18),
                        bookW = (blockSize / 1.95) * scale,
                        bookH = (blockSize / 1.48) * scale,
                        bookX = (j * blockSize) + ((blockSize - bookW) / 2),
                        bookY = (i * blockSize) + ((blockSize - bookH) / 2),
                        inset = Math.max(1, blockSize / 14),
                        spine = Math.max(2, blockSize / 8);

                    ctx.fillStyle = "#000";
		            ctx.fillRect((j * blockSize), (i * blockSize), 
                                 blockSize, blockSize);

                    ctx.fillStyle = "#1d4ed8";
                    ctx.fillRect(bookX, bookY, bookW, bookH);

                    ctx.fillStyle = "#eff6ff";
                    ctx.fillRect(bookX + inset, bookY + inset, (bookW / 2) - (spine / 2) - inset, bookH - (inset * 2));
                    ctx.fillRect(bookX + (bookW / 2) + (spine / 2), bookY + inset, (bookW / 2) - (spine / 2) - inset, bookH - (inset * 2));

                    ctx.fillStyle = "#93c5fd";
                    ctx.fillRect(bookX + (bookW / 2) - (spine / 2), bookY + inset, spine, bookH - (inset * 2));

                    ctx.fillStyle = "#dbeafe";
                    ctx.fillRect(bookX + inset + 1, bookY + inset + 1, Math.max(1, (bookW / 2) - (spine / 2) - (inset * 2)), 1);
                    ctx.fillRect(bookX + (bookW / 2) + (spine / 2) + 1, bookY + inset + 1, Math.max(1, (bookW / 2) - (spine / 2) - (inset * 2)), 1);
                }
		    }
	    }
    };
    
    function draw(ctx) {
        
        var i, j, size = blockSize;

        ctx.fillStyle = "#000";
	    ctx.fillRect(0, 0, width * size, height * size);

        drawWall(ctx);
        
        for (i = 0; i < height; i += 1) {
		    for (j = 0; j < width; j += 1) {
			    drawBlock(i, j, ctx);
		    }
	    }
    };
    
    function drawBlock(y, x, ctx) {

        var layout = map[y][x];

        if (layout === Pacman.PILL) {
            return;
        }

        ctx.beginPath();
        
        if (layout === Pacman.EMPTY || layout === Pacman.BLOCK || 
            layout === Pacman.BISCUIT) {
            
            ctx.fillStyle = "#000";
		    ctx.fillRect((x * blockSize), (y * blockSize), 
                         blockSize, blockSize);

            if (layout === Pacman.BISCUIT) {
                var bookX = Math.round((x * blockSize) + (blockSize / 2) - (blockSize / 5)),
                    bookY = Math.round((y * blockSize) + (blockSize / 2) - (blockSize / 6)),
                    bookW = Math.round(blockSize / 2.4),
                    bookH = Math.round(blockSize / 2.9),
                    halfW = Math.floor((bookW - 1) / 2);

                ctx.fillStyle = "#000000";
                ctx.fillRect(bookX, bookY, bookW, bookH);

                ctx.fillStyle = "#ffffff";
		        ctx.fillRect(bookX + 1, bookY + 1, halfW - 1, bookH - 2);
		        ctx.fillRect(bookX + halfW + 1, bookY + 1, halfW - 1, bookH - 2);

                ctx.fillStyle = "#94a3b8";
                ctx.fillRect(bookX + halfW, bookY + 1, 1, bookH - 2);
                ctx.fillRect(bookX + 2, bookY + 2, halfW - 3, 1);
                ctx.fillRect(bookX + halfW + 2, bookY + 2, halfW - 3, 1);
                ctx.fillRect(bookX + 2, bookY + bookH - 3, halfW - 3, 1);
                ctx.fillRect(bookX + halfW + 2, bookY + bookH - 3, halfW - 3, 1);
	        }
        }
        ctx.closePath();	 
    };

    reset();
    
    return {
        "draw"         : draw,
        "drawBlock"    : drawBlock,
        "drawPills"    : drawPills,
        "block"        : block,
        "setBlock"     : setBlock,
        "reset"        : reset,
        "isWallSpace"  : isWall,
        "isFloorSpace" : isFloorSpace,
        "height"       : height,
        "width"        : width,
        "blockSize"    : blockSize
    };
};

Pacman.Audio = function(game) {
    
    var files          = [], 
        endEvents      = [],
        progressEvents = [],
        playing        = [];
    
    function load(name, path, cb) { 

        var f = files[name] = document.createElement("audio");

        progressEvents[name] = function(event) { progress(event, name, cb); };
        
        f.addEventListener("canplaythrough", progressEvents[name], true);
        f.setAttribute("preload", "true");
        f.setAttribute("autobuffer", "true");
        f.setAttribute("src", path);
        f.pause();        
    };

    function progress(event, name, callback) { 
        if (event.loaded === event.total && typeof callback === "function") {
            callback();
            files[name].removeEventListener("canplaythrough", 
                                            progressEvents[name], true);
        }
    };

    function disableSound() {
        for (var i = 0; i < playing.length; i++) {
            if (files[playing[i]]) {
                files[playing[i]].pause();
                files[playing[i]].currentTime = 0;
            }
        }
        playing = [];
    };

    function ended(name) { 

        var i, tmp = [], found = false;

        files[name].removeEventListener("ended", endEvents[name], true);

        for (i = 0; i < playing.length; i++) {
            if (!found && playing[i]) { 
                found = true;
            } else { 
                tmp.push(playing[i]);
            }
        }
        playing = tmp;
    };

    function play(name) { 
        if (!game.soundDisabled() && files[name]) {
            endEvents[name] = function() { ended(name); };
            playing.push(name);
            files[name].addEventListener("ended", endEvents[name], true);
            files[name].play();
        }
    };

    function pause() { 
        for (var i = 0; i < playing.length; i++) {
            if (files[playing[i]]) {
                files[playing[i]].pause();
            }
        }
    };
    
    function resume() { 
        for (var i = 0; i < playing.length; i++) {
            if (files[playing[i]]) {
                files[playing[i]].play();
            }
        }        
    };
    
    return {
        "disableSound" : disableSound,
        "load"         : load,
        "play"         : play,
        "pause"        : pause,
        "resume"       : resume
    };
};

Object.prototype.clone = function () {
    var i, newObj = (this instanceof Array) ? [] : {};
    for (i in this) {
        if (i === 'clone') {
            continue;
        }
        if (this[i] && typeof this[i] === "object") {
            newObj[i] = this[i].clone();
        } else {
            newObj[i] = this[i];
        }
    }
    return newObj;
};
